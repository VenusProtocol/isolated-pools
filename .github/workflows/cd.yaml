name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    # The "release" environment is limited to the release branches.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          cache: "yarn"
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          yarn semantic-release
          # Publish slim for the release tag on this exact commit: either semantic-release just
          # released it, or this is a rerun after the slim publish failed. On a rerun package.json
          # is back to the placeholder, so restore the version from the tag once the main package
          # is confirmed on npm.
          if [ "$(jq -r .version package.json)" = "0.0.0-semantically-released" ]; then
            TAG=$(git tag --list 'v[0-9]*' --points-at HEAD --sort=-v:refname | head -n 1)
            if [ -z "$TAG" ] || [ -z "$(npm view "$(jq -r .name package.json)@${TAG#v}" version 2>/dev/null)" ]; then
              exit 0
            fi
            jq --arg v "${TAG#v}" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Prepare slim package
        if: steps.release.outputs.released == 'true'
        run: bash .github/prepare_slim_package.sh

      - name: Publish slim package
        if: steps.release.outputs.released == 'true'
        run: bash .github/publish_slim_package.sh
