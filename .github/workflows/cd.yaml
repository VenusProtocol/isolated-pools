name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    # The "release" environment is limited to the release branches.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          cache: "yarn"
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          yarn semantic-release
          # package.json keeps the placeholder version unless semantic-release published a release.
          if [ "$(jq -r .version package.json)" != "0.0.0-semantically-released" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare slim package
        if: steps.release.outputs.released == 'true'
        run: bash .github/prepare_slim_package.sh

      - name: Publish slim package
        if: steps.release.outputs.released == 'true'
        run: bash .github/publish_slim_package.sh
