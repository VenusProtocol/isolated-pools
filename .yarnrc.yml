# Resolve this package's own name from npm, never from the workspace. Other Venus
# packages depend on it by range, and a stable release version on main would satisfy
# that range, turning the dependency into a link to this repo and changing the lockfile.
enableTransparentWorkspaces: false

nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
    spec: "@yarnpkg/plugin-interactive-tools"

yarnPath: .yarn/releases/yarn-3.2.0.cjs
